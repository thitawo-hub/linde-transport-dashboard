<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LINDE TRANSPORT - รายงานประจำวัน</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .daily-page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 30px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: #6b7280;
    }

    .filters {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .filter-group input,
    .filter-group select {
      height: 40px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
    }

    .summary-label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 30px;
      font-weight: 700;
    }

    .table-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-job {
      background: #dcfce7;
      color: #166534;
    }

    .status-no-job {
      background: #f3f4f6;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .daily-page {
        padding: 16px;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="daily-page">

  <div class="page-header">
    <h1>📋 รายงานประจำวัน</h1>
    <p>ตรวจสอบสถานะการจัดรถและงานของรถแต่ละคัน</p>
  </div>

  <div class="filters">

    <div class="filter-group">
      <label>วันที่</label>
      <input type="date" id="reportDate">
    </div>

    <div class="filter-group">
      <label>สาขา</label>
      <select id="branchFilter">
        <option value="">ทั้งหมด</option>
      </select>
    </div>

  </div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">🚛 รถทั้งหมด</div>
      <div class="summary-value" id="totalCars">-</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">🟢 มีงาน</div>
      <div class="summary-value" id="jobCars">-</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">⚪ ไม่มีงาน</div>
      <div class="summary-value" id="noJobCars">-</div>
    </div>

  </div>

  <div class="table-card">

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>สาขา</th>
            <th>เบอร์รถ</th>
            <th>ทะเบียน</th>
            <th>ประเภทรถ</th>
            <th>สถานะ</th>
            <th>สถานะรถ</th>
            <th>ประเภทงาน</th>
            <th>LTS</th>
            <th>พขร.</th>
            <th>ช่วงเวลา</th>
            <th>หนัก / เบา</th>
          </tr>
        </thead>

        <tbody id="reportTableBody">
          <tr>
            <td colspan="11" class="loading">
              กำลังโหลดข้อมูล...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>

<script src="daily-report.js"></script>

</body>
</html>
