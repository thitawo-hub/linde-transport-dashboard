<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LINDE TRANSPORT OVERVIEW</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>LINDE TRANSPORT OVERVIEW</h1>
    <p>Transport Performance & Operational Monitoring</p>
  </header>

  <main class="container">

<div class="filters">

  <div>
    <label for="startDate">วันที่เริ่ม</label>
    <input type="date" id="startDate">
  </div>

  <div>
    <label for="endDate">วันที่สิ้นสุด</label>
    <input type="date" id="endDate">
  </div>

  <div>
    <label for="branchFilter">สาขา</label>
    <select id="branchFilter">
      <option value="">ทุกสาขา</option>
    </select>
  </div>

</div>

    <div class="cards">

<div class="cards">

  <div class="card">
    <div class="card-title">🚚 รถ COCO</div>
    <div class="card-value" id="cocoCars">-</div>
  </div>

  <div class="card">
    <div class="card-title">👨‍✈️ พขร.</div>
    <div class="card-value" id="cocoDrivers">-</div>
  </div>

  <div class="card">
    <div class="card-title">📊 Driver Ratio</div>
    <div class="card-value" id="driverRatio">-</div>
  </div>

  <div class="card">
    <div class="card-title">🎯 Target KM/คัน/เดือน</div>
    <div class="card-value" id="targetKm">-</div>
  </div>

  <div class="card">
    <div class="card-title">🚚 KM รวม</div>
    <div class="card-value" id="totalKm">-</div>
  </div>

  <div class="card">
    <div class="card-title">📅 KM เฉลี่ย/วัน</div>
    <div class="card-value" id="avgKmDay">-</div>
  </div>

  <div class="card">
    <div class="card-title">🚛 KM เฉลี่ย/คัน</div>
    <div class="card-value" id="avgKmCar">-</div>
  </div>

  <div class="card">
    <div class="card-title">🎯 Achievement</div>
    <div class="card-value" id="kmAchievement">-</div>
  </div>

</div>

    <section class="section">
      <h2>ข้อมูลจาก Supabase</h2>
      <div id="status">กำลังโหลดข้อมูล...</div>
    </section>

  </main>

  <script src="app.js"></script>

</body>

  
</html>
